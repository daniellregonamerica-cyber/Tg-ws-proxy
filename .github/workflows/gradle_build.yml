name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Inject Repositories & Build
      run: |
        # Сохраняем init-скрипт для подтягивания плагинов Google/Maven
        mkdir -p ~/.gradle
        echo "gradle.projectsLoaded { rootProject { buildscript { repositories { google(); mavenCentral(); gradlePluginPortal() } } } }" > ~/.gradle/init.gradle
        
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug --stacktrace

    - name: Find and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tg-ws-proxy-apk
        path: '**/*.apk'
        
