name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -q tg-ws-proxy-android-main.zip -d project

      - name: Find project
        run: |
          PROJECT=$(find project -name gradlew -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/**/build/outputs/apk/**/*.apk
